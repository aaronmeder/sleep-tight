name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

# Secret names are placeholders until the real ones are known.
env:
  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
  SSH_USER: ${{ secrets.DEPLOY_USER }}
  SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
  REMOTE_PHP: ${{ vars.DEPLOY_PHP || 'php' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$REMOTE_PATH" ]; then
            echo "::warning::Deploy secrets not set, skipping deploy."
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready

      - name: Set up SSH
        if: steps.cfg.outputs.ready
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload
        if: steps.cfg.outputs.ready
        run: |
          # data/ (the SQLite database and backups) is never touched or deleted.
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            --include='/data/.htaccess' --exclude='/data/*' \
            --exclude='/.git*' --exclude='/.sync.json' --exclude='/README.md' \
            --exclude='/bin/seed' --exclude='/bin/sync' \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Run migrations
        if: steps.cfg.outputs.ready
        run: ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cd '$REMOTE_PATH' && $REMOTE_PHP bin/migrate"
