name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
  SSH_USER: ${{ secrets.DEPLOY_USER }}
  SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  SSH_KEY: ${{ secrets.DEPLOY_KEY }}
  # Non-public folder on the server (no trailing slash); its public/ subfolder is the web root.
  REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
  REMOTE_PHP: ${{ vars.DEPLOY_PHP || 'php84' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          for i in 1 2 3; do
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 10
          done
          test -s ~/.ssh/known_hosts

      - name: Upload
        run: |
          # Only these four folders are synced; data/ (SQLite database, backups) and anything
          # else in the target folder is left alone.
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            --exclude='/bin/seed' --exclude='/bin/sync' \
            public lib migrations bin "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Run migrations
        run: ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cd '$REMOTE_PATH' && $REMOTE_PHP bin/migrate"
